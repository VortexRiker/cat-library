<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Library</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js"></script>
</head>
<body>
    <table>
        <caption>
            Books in Your Library
        </caption>
        <thead>
            <tr>
                <th scope="col">Title</th>
                <th scope="col">Author</th>
                <th scope="col">Pages</th>
                <th scope="col">Read</th>
            </tr>
        </thead>
        <tbody class="table-body-area">
        </tbody>
    </table>
    <dialog id="add-book-dialog" closedby="any">
        <form id="add-book-form" method="dialog">
            <ul>
                <li>
                    <label for="book-title">TITLE</label>
                    <input type="text" name="book-title" id="book-title" required>
                </li>
                <li>
                    <label for="book-author">AUTHOR</label>
                    <input type="text" name="book-author" id="book-author" required>
                </li>
                <li>
                    <label for="book-pages">PAGES</label>
                    <input type="tel" name="book-pages" id="book-pages" required>
                </li>
                <li>
                    <label for="book-read">FINISHED READING?</label>
                    <input type="checkbox" name="book-read" id="book-read">
                </li>
                <div class="form-controls">
                    <button id="form=controls-submit" type="submit">Add</button>
                    <button id="form-controls-clear" type="button">Clear</button>
                    <button id="form-controls-close" type="button" commandfor="add-book-dialog" command="close">Close</button>
                </div>
            </ul>
        </form>
    </dialog>
    <button type="button" commandfor="add-book-dialog" command="show-modal">Add Book</button>
</body>
</html>
